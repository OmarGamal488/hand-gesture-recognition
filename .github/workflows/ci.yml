name: CI

on:
  push:
    branches: [main, research]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check . || true

      - name: Run pytest
        # Tests that hit the real model are skipped if the .pkl files aren't
        # committed (LFS); features/api tests run unconditionally.
        run: uv run pytest tests/ -q
